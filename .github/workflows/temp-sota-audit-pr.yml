name: Temporary WolfXL SOTA audit

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  benchmark:
    if: github.event.pull_request.number == 4
    name: Fresh Linux SOTA audit
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out PR merge
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install pinned benchmark libraries
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "wolfxl==2.0.1" \
            "openpyxl==3.1.5" \
            "XlsxWriter==3.2.9" \
            "PyExcelerate==0.13.0" \
            "pylightxl==1.61" \
            "pandas==3.0.5" \
            "polars==1.43.2" \
            "python-calamine==0.8.2" \
            "fastexcel==0.20.2" \
            "pyarrow==25.0.1" \
            "jetxl==0.3.0"

      - name: Run matched openpyxl-compatible cases
        run: |
          mkdir -p audit-results
          python benchmarks/benchmark_openpyxl_vs_wolfxl.py \
            --rounds 5 \
            --large-rounds 3 \
            --no-memory \
            --case write_append_plain,read_values_plain,read_only_values_plain,modify_two_cells_plain,large_write_append_plain,large_read_values_plain,large_read_only_values_plain,large_modify_two_cells_plain \
            --output-dir audit-results \
            --prefix fresh-openpyxl

      - name: Run maintained Python ecosystem cases
        run: |
          python benchmarks/benchmark_python_excel_ecosystem.py \
            --rounds 5 \
            --round-budget 600 \
            --no-memory \
            --case write_plain_large,write_mixed,write_unique_strings,read_values_large \
            --engines wolfxl,openpyxl,openpyxl_wo,xlsxwriter,xlsxwriter_cm,pyexcelerate,polars,python_calamine,fastexcel \
            --output-dir audit-results \
            --prefix fresh-ecosystem

      - name: Run Jetxl category-boundary case
        run: |
          python benchmarks/benchmark_wolfxl_vs_jetxl.py \
            --rows 200000 \
            --cols 8 \
            --rounds 5 \
            --output-dir audit-results

      - name: Publish summary
        if: always()
        run: |
          for report in audit-results/*.md; do
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload raw results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: sota-audit-results
          path: audit-results
          if-no-files-found: error
